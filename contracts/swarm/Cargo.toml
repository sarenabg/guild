[package]
name = "hive-swarm"
description = "Hive: jobs with held budgets, AI-reviewed agents with fuel tanks, and payouts on NEAR"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
# Resolver 3 picks dependency versions that compile with `rust-version`
# (near-sdk 5.27.0 is the newest that builds with Rust 1.92).
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.27.0", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "5.27.0", features = ["unit-testing", "unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
